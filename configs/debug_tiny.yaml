# Tiny settings to check that the whole pipeline runs end to end in a few minutes on a CPU or
# laptop GPU. Results are meaningless; use it only to catch setup problems before a real run.
#   python scripts/train.py --config configs/debug_tiny.yaml
data:
  image_size: [64, 64]
diffusion:
  T_total: 100
  t_roi_max: 80
  t_bg: 40
model:
  roi_channels: [16, 32, 32, 64]
  ctx_channels: [8, 16, 16, 32]
  dec_channels: [16, 16, 32, 32]
  roi_blocks: 1
  ctx_blocks: 1
  dec_blocks: 1
  emb_dim: 64
  attn_heads: 2
  dropout: 0.0
train:
  out_dir: runs/debug_tiny
  batch_size: 4
  iters: 200
  warmup_iters: 10
  num_workers: 0
  log_every: 20
  val_every: 100
  ckpt_every: 100
  preview_every: 100
  batch_vis_every: 50
  quick_eval_every: 100
  quick_eval_n: 4
eval:
  steps_stage1: 5
  steps_stage2: 5
  batch_size: 4
  save_vis: 8
